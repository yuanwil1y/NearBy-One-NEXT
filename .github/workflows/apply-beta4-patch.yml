name: Apply beta.4 QA patch retry 2

on:
  push:
    branches:
      - qa/beta4-retry-2
    paths:
      - .github/workflows/apply-beta4-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply beta.4 product patch
        run: |
          python tools/beta4_retry_storage.py
          python tools/beta4_retry_followup.py
          python tools/beta4_retry_web.py
          python tools/beta4_retry_ui_portal.py
          python tools/beta4_retry_ci.py
      - name: Run regression guards before commit
        run: |
          python tests/integration/test_beta1_bench_regressions.py
          python tests/integration/test_beta3_qa_regressions.py
          python tests/integration/test_beta4_qa_regressions.py
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/nearby_ui \
                  firmware/components/nearby_board \
                  firmware/components/db_storage \
                  firmware/components/web_mgmt \
                  firmware/main/main.c \
                  firmware/main/portal_index.html \
                  web-portal/index.html \
                  tests/integration/test_beta4_qa_regressions.py \
                  .github/workflows/qa-beta1-bench-fix.yml \
                  .github/workflows/beta-release.yml
          git rm -f .github/workflows/apply-beta4-patch.yml \
                    tools/beta4_patch.py \
                    tools/beta4_retry_storage.py \
                    tools/beta4_retry_followup.py \
                    tools/beta4_retry_web.py \
                    tools/beta4_retry_ui_portal.py \
                    tools/beta4_retry_ci.py
          git rm -rf tools/beta4_patch_chunks
          git diff --cached --check
          git commit -m "fix: address beta.4 physical QA findings"
          git push origin HEAD:qa/beta4-retry-2
