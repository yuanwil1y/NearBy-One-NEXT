name: One-shot web_mgmt NUL fixer

on:
  push:
    branches:
      - qa/beta4-retry-2
    paths:
      - .github/workflows/fix-web-mgmt-nul-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace embedded NUL character literals
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('firmware/components/web_mgmt/web_mgmt.c')
          data = path.read_bytes()
          needle = b"'\x00'"
          replacement = b"'\\0'"
          count = data.count(needle)
          if count != 4:
              raise SystemExit(f'expected exactly 4 embedded NUL literals, found {count}')
          data = data.replace(needle, replacement)
          if b'\x00' in data:
              raise SystemExit('unexpected NUL byte remains in web_mgmt.c')
          path.write_bytes(data)
          print('replaced 4 embedded NUL literals')
          PY
      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/components/web_mgmt/web_mgmt.c
          git diff --cached --check
          git commit -m "fix(web): replace embedded NUL character literals"
          git push origin HEAD:qa/beta4-retry-2
