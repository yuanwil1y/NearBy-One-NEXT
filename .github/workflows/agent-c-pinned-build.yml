name: Agent C pinned recognition DB reproducibility

on:
  push:
    branches:
      - agent-c/device-database
    paths:
      - .github/workflows/agent-c-pinned-build.yml
      - tools/dbgen/*.py
      - tools/dbgen/pins.json
      - components/recognition_db/**
      - artifacts/pinned/nearby.nbdb
      - docs/db/**
      - THIRD_PARTY.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read immutable pins
        id: pins
        shell: bash
        run: |
          echo "ha=$(python -c 'import json; print(json.load(open("tools/dbgen/pins.json"))["home_assistant_core"]["revision"])')" >> "$GITHUB_OUTPUT"
          echo "zha=$(python -c 'import json; print(json.load(open("tools/dbgen/pins.json"))["zha_device_handlers"]["revision"])')" >> "$GITHUB_OUTPUT"
          echo "z2m=$(python -c 'import json; print(json.load(open("tools/dbgen/pins.json"))["zigbee_herdsman_converters"]["revision"])')" >> "$GITHUB_OUTPUT"
          echo "bt=$(python -c 'import json; print(json.load(open("tools/dbgen/pins.json"))["bluetooth_numbers_nordic"]["revision"])')" >> "$GITHUB_OUTPUT"
          echo "zh=$(python -c 'import json; print(json.load(open("tools/dbgen/pins.json"))["zigbee_herdsman_defs"]["revision"])')" >> "$GITHUB_OUTPUT"
          echo "matter=$(python -c 'import json; print(json.load(open("tools/dbgen/pins.json"))["smartthings_matter_fingerprints"]["revision"])')" >> "$GITHUB_OUTPUT"

      - name: Fetch pinned Home Assistant generated discovery files
        shell: bash
        run: |
          mkdir -p /tmp/nearby-ha/homeassistant/generated
          for name in bluetooth zeroconf ssdp dhcp; do
            curl --fail --location --silent --show-error \
              "https://raw.githubusercontent.com/home-assistant/core/${{ steps.pins.outputs.ha }}/homeassistant/generated/${name}.py" \
              --output "/tmp/nearby-ha/homeassistant/generated/${name}.py"
          done

      - name: Fetch pinned ZHA source tree without executing it
        shell: bash
        run: |
          git init /tmp/nearby-zha
          git -C /tmp/nearby-zha remote add origin https://github.com/zigpy/zha-device-handlers.git
          git -C /tmp/nearby-zha -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "${{ steps.pins.outputs.zha }}"
          git -C /tmp/nearby-zha checkout --detach FETCH_HEAD

      - name: Fetch pinned Zigbee2MQTT converter sources without executing them
        shell: bash
        run: |
          git init /tmp/nearby-z2m
          git -C /tmp/nearby-z2m remote add origin https://github.com/Koenkk/zigbee-herdsman-converters.git
          git -C /tmp/nearby-z2m -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "${{ steps.pins.outputs.z2m }}"
          git -C /tmp/nearby-z2m checkout --detach FETCH_HEAD

      - name: Fetch pinned redistributable Bluetooth assigned numbers
        shell: bash
        run: |
          mkdir -p /tmp/nearby-bt/v1
          for name in company_ids service_uuids; do
            curl --fail --location --silent --show-error \
              "https://raw.githubusercontent.com/nordicsemi/bluetooth-numbers-database/${{ steps.pins.outputs.bt }}/v1/${name}.json" \
              --output "/tmp/nearby-bt/v1/${name}.json"
          done

      - name: Fetch pinned MIT Zigbee identifier definitions
        shell: bash
        run: |
          mkdir -p /tmp/nearby-zh/src/zspec/zcl/definition /tmp/nearby-zh/src/zspec
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/Koenkk/zigbee-herdsman/${{ steps.pins.outputs.zh }}/src/zspec/zcl/definition/manufacturerCode.ts" \
            --output /tmp/nearby-zh/src/zspec/zcl/definition/manufacturerCode.ts
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/Koenkk/zigbee-herdsman/${{ steps.pins.outputs.zh }}/src/zspec/consts.ts" \
            --output /tmp/nearby-zh/src/zspec/consts.ts

      - name: Fetch pinned Apache SmartThings Matter fingerprints
        shell: bash
        run: |
          mkdir -p /tmp/nearby-matter
          python -c 'import json; print("\n".join(json.load(open("tools/dbgen/pins.json"))["smartthings_matter_fingerprints"]["source_paths"]))' | \
          while IFS= read -r path; do
            mkdir -p "/tmp/nearby-matter/$(dirname "$path")"
            curl --fail --location --silent --show-error \
              "https://raw.githubusercontent.com/SmartThingsCommunity/SmartThingsEdgeDrivers/${{ steps.pins.outputs.matter }}/${path}" \
              --output "/tmp/nearby-matter/${path}"
          done

      - name: Run host corruption and generator tests
        run: python -m unittest discover -s tools/dbgen -p 'test_*.py' -v

      - name: Regenerate pinned database and report in temporary path
        shell: bash
        run: |
          rm -rf /tmp/nearby-pinned-verify
          mkdir -p /tmp/nearby-pinned-verify
          python tools/dbgen/build_pinned.py \
            --pins tools/dbgen/pins.json \
            --ha-bluetooth /tmp/nearby-ha/homeassistant/generated/bluetooth.py \
            --ha-zeroconf /tmp/nearby-ha/homeassistant/generated/zeroconf.py \
            --ha-ssdp /tmp/nearby-ha/homeassistant/generated/ssdp.py \
            --ha-dhcp /tmp/nearby-ha/homeassistant/generated/dhcp.py \
            --zha-root /tmp/nearby-zha/zhaquirks \
            --z2m-root /tmp/nearby-z2m/src/devices \
            --bt-company-ids /tmp/nearby-bt/v1/company_ids.json \
            --bt-service-uuids /tmp/nearby-bt/v1/service_uuids.json \
            --zigbee-manufacturer-codes /tmp/nearby-zh/src/zspec/zcl/definition/manufacturerCode.ts \
            --zigbee-consts /tmp/nearby-zh/src/zspec/consts.ts \
            --matter-root /tmp/nearby-matter \
            --out /tmp/nearby-pinned-verify/nearby.nbdb \
            --report /tmp/nearby-pinned-verify/coverage-pinned.json

      - name: Release preflight generated and committed databases
        run: |
          python tools/dbgen/preflight.py /tmp/nearby-pinned-verify/nearby.nbdb --release
          python tools/dbgen/preflight.py artifacts/pinned/nearby.nbdb --release

      - name: Verify deterministic DB and report hashes
        shell: bash
        run: |
          echo "DB hashes:"
          sha256sum /tmp/nearby-pinned-verify/nearby.nbdb artifacts/pinned/nearby.nbdb
          if ! cmp -s /tmp/nearby-pinned-verify/nearby.nbdb artifacts/pinned/nearby.nbdb; then
            echo "ERROR: regenerated nearby.nbdb differs from committed artifact" >&2
            exit 1
          fi

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          generated_path = Path('/tmp/nearby-pinned-verify/coverage-pinned.json')
          committed_path = Path('docs/db/coverage-pinned.json')

          def deterministic_projection(path: Path) -> bytes:
              value = json.loads(path.read_text(encoding='utf-8'))
              # Legacy committed reports may contain host timing from the old
              # auto-commit pipeline. Timing is not reproducibility metadata.
              value.pop('timing_ms', None)
              db = value.get('db')
              if isinstance(db, dict):
                  db['path'] = 'artifacts/pinned/nearby.nbdb'
              return (json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n').encode('utf-8')

          generated = deterministic_projection(generated_path)
          committed = deterministic_projection(committed_path)
          generated_sha = hashlib.sha256(generated).hexdigest()
          committed_sha = hashlib.sha256(committed).hexdigest()
          print(f'report deterministic sha256 generated={generated_sha}')
          print(f'report deterministic sha256 committed={committed_sha}')
          if generated != committed:
              import difflib
              gen_text = json.dumps(json.loads(generated), ensure_ascii=False, indent=2, sort_keys=True).splitlines()
              old_text = json.dumps(json.loads(committed), ensure_ascii=False, indent=2, sort_keys=True).splitlines()
              print('\n'.join(difflib.unified_diff(old_text, gen_text, fromfile='committed/coverage-pinned.json', tofile='regenerated/coverage-pinned.json')), file=sys.stderr)
              raise SystemExit('ERROR: deterministic coverage report differs from committed artifact')
          PY

      - name: Assert verification did not modify tracked files
        shell: bash
        run: |
          test -z "$(git status --porcelain)" || {
            git status --short
            echo "ERROR: reproducibility verification modified the checkout" >&2
            exit 1
          }
