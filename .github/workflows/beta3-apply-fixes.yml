name: Apply beta.3 QA fix bundle

on:
  push:
    branches:
      - qa/beta-0.1-bench-bugs
    paths:
      - .github/workflows/beta3-apply-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoped beta.3 QA fixes
        run: python tools/apply_beta3_qa_fixes.py
      - name: Run beta.3 regression guard before commit
        run: python tests/integration/test_beta3_qa_regressions.py
      - name: Commit product fixes only
        run: |
          git restore .github/workflows/beta-release.yml .github/workflows/qa-beta1-bench-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/nearby_ui/nearby_ui.c \
                  firmware/components/web_mgmt/include/web_mgmt.h \
                  firmware/components/web_mgmt/web_mgmt.c \
                  firmware/main/main.c \
                  firmware/main/portal_index.html \
                  web-portal/index.html \
                  tests/integration/test_beta3_qa_regressions.py
          git commit -m "fix: resolve beta.3 QA regressions"
          git push
