name: Agent D ESP-IDF v6.1 build

on:
  push:
    branches:
      - agent-d/hardware-driver-audit
    paths:
      - "firmware/**"
      - ".github/workflows/agent-d-idf61-build.yml"
  workflow_dispatch:

jobs:
  build-default:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build default firmware with ESP-IDF v6.1
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32c6
          path: firmware

  build-all-benches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Compile every BENCH_REQUIRED path with ESP-IDF v6.1
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32c6
          path: firmware
          command: idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.bench-ci" build
