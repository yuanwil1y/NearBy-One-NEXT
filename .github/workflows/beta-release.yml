name: NearBy One NEXT beta.2 release

on:
  push:
    branches:
      - qa/beta-0.1-bench-bugs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beta-release:
    if: github.ref == 'refs/heads/qa/beta-0.1-bench-bugs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build ESP-IDF v6.1 firmware and two-file package
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32c6
          path: firmware
          command: >-
            idf.py build &&
            mkdir -p ../release &&
            cd build &&
            esptool --chip esp32c6 merge-bin -o ../../release/NearBy-One-NEXT-ESP32C6.bin @flash_args &&
            cd .. &&
            cp ../artifacts/pinned/nearby.nbdb ../release/NearBy-One-NEXT.nbdb

      - name: Publish v0.1.0-beta.2 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0-beta.2 \
            release/NearBy-One-NEXT-ESP32C6.bin \
            release/NearBy-One-NEXT.nbdb \
            --target "$GITHUB_SHA" \
            --title "NearBy One NEXT v0.1.0-beta.2" \
            --prerelease \
            --notes-file - <<'EOF'
          Second public beta for Waveshare ESP32-C6-Touch-LCD-1.9.

          This beta contains the software fixes from the first physical-board QA pass:
          - BUG-LCD-004: correct ST7789 RGB565 byte order so HA blue is rendered with the intended color.
          - BUG-UI-003: separate/scroll the Web Management credentials area so Stop Portal does not cover credentials.
          - BUG-UI-001: ensure the LVGL Montserrat 14 symbol glyph font is actually compiled and linked.

          Release files:
          - `NearBy-One-NEXT-ESP32C6.bin` — merged ESP32-C6 image; flash from address `0x0`.
          - `NearBy-One-NEXT.nbdb` — recognition database; install through Web Management → Database.

          Verification status:
          - Host/regression and ESP-IDF v6.1 compile checks passed for the software fixes before this release build.
          - Physical-board acceptance for the three bugs remains `RETEST_REQUIRED`; this release does not claim the bench issues PASS until they are retested on hardware.
          EOF
